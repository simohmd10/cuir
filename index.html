<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Sacs et accessoires en cuir fabriqués à la main au Maroc." />
    <meta name="keywords" content="maroquinerie, cuir, sacs en cuir, artisanat marocain, accessoires cuir" />
    <meta property="og:title" content="CUIR — Maroquinerie de luxe artisanale" />
    <meta property="og:description" content="Sacs et accessoires en cuir fabriqués à la main au Maroc." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Polices réellement utilisées par tailwind.config.js :
        font-display -> Cormorant Garamond (300/400/600/700 + italique 300/400)
        font-body    -> DM Sans           (300/400/500/600 + italique 300/400)
      Chargées ici en <link> et non via @import dans index.css : un @import
      n'est découvert qu'après le téléchargement ET l'analyse du CSS, ce qui
      sérialise une requête supplémentaire avant le premier rendu du texte.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Image LCP du héros : la demander tôt plutôt qu'après l'exécution du JS -->
    <link rel="preload" as="image" href="/hero-poster.jpg" fetchpriority="high" />
    <title>CUIR — Maroquinerie de luxe artisanale</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
